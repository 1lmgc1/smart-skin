name: p08d2-topology-assist
on:
  push:
    branches: [p08d2-topology-assist]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topology-assist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve production and D1B sources
        run: |
          git diff --exit-code 6f89eed8df9bbc7d3eae51d08a17885155bc5de5 HEAD -- src tests scripts Directory.Build.props VERSION experiments/P08D.GeometricAttachment experiments/P08D.StructuredTransition
      - name: Run D2A tests
        working-directory: experiments/P08D.TopologyAssist
        run: python -m unittest -v test_topology_generalization.py
