name: build-p00

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmartSkin.sln

      - name: Build
        run: dotnet build SmartSkin.sln --configuration Release --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Unit tests
        run: dotnet test tests/SmartSkin.Core.Tests/SmartSkin.Core.Tests.csproj --configuration Release --framework net8.0 --no-build --logger "trx;LogFileName=core-tests.trx"

      - name: Package field-test artifact
        id: package
        shell: pwsh
        run: ./scripts/Package-Artifact.ps1 -Configuration Release -Version "0.0.1-p00" -Commit "${{ github.sha }}"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartSkin-P00-test-report-${{ github.run_number }}
          path: tests/SmartSkin.Core.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Rhino field-test package
        uses: actions/upload-artifact@v4
        with:
          name: SmartSkin-P00-${{ github.run_number }}-${{ github.sha }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
