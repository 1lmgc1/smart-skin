name: geometric-attachments-p08d1b
on:
  push:
    branches: [p08-structured-transition]
    paths:
      - 'experiments/P08D.GeometricAttachment/**'
      - 'docs/P08D1B_GEOMETRIC_ATTACHMENT.md'
      - '.github/workflows/geometric-attachments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometric-attachment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PYTHONPATH: experiments/P08D.GeometricAttachment:experiments/P08D.StructuredTransition:experiments/P08C.CornerRepair:experiments/P08C.GeometricFairing:experiments/P08C.UVFairing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve product and previous constructors
        run: git diff --exit-code 2007a5793a9e9270ea64190e9d473675b26b1bda HEAD -- src tests scripts Directory.Build.props VERSION experiments/P08B.Construction experiments/P08C.AxisGuidance experiments/P08C.UVFairing experiments/P08C.GeometricFairing experiments/P08C.CornerRepair experiments/P08D.StructuredTransition .github/workflows/build.yml .github/workflows/structured-transition.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 rhino3dm==8.17.0
      - name: Previous regressions
        run: |
          set -o pipefail
          mkdir -p attachment-artifact
          for suite in P08C.UVFairing P08C.GeometricFairing P08C.CornerRepair P08D.StructuredTransition; do
            python -m unittest discover -s experiments/$suite -p 'test_*.py' -v 2>&1 | tee attachment-artifact/$suite-tests.txt
          done
      - name: Geometric chart, exact rollback and native OpenNURBS tests
        run: |
          set -o pipefail
          python -m py_compile experiments/P08D.GeometricAttachment/*.py
          python -m unittest discover -s experiments/P08D.GeometricAttachment -p 'test_*.py' -v 2>&1 | tee attachment-artifact/attachment-tests.txt
      - name: Package source and explicit verification scope
        run: |
          cp experiments/P08D.GeometricAttachment/*.py docs/P08D1B_GEOMETRIC_ATTACHMENT.md attachment-artifact/
          python - <<'PY'
          import pathlib, json, hashlib, os
          root=pathlib.Path('attachment-artifact')
          out=dict(patch='P08D.1B',commit=os.environ['GITHUB_SHA'],native_Rhino_Join='NOT_RUN',private_model='NOT_SENT_TO_CI',RHP_updated=False,geometry_commit=False)
          out['sha256']={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('*.py')}
          (root/'verification-scope.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SmartSkin-P08D1B-${{ github.run_number }}-${{ github.sha }}
          path: attachment-artifact/*
          if-no-files-found: error
          retention-days: 30
