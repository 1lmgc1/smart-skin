name: structured-transition-p08d1a
on:
  push:
    branches: [p08-structured-transition]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint-graph-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PYTHONPATH: experiments/P08D.StructuredTransition:experiments/P08C.CornerRepair:experiments/P08C.GeometricFairing:experiments/P08C.UVFairing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve product and prior constructors
        run: git diff --exit-code f7869f82a0d6fe58b39a254a6b83248871571d71 HEAD -- src tests scripts Directory.Build.props VERSION experiments/P08B.Construction experiments/P08C.AxisGuidance experiments/P08C.UVFairing experiments/P08C.GeometricFairing experiments/P08C.CornerRepair .github/workflows/build.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.2.6 scipy==1.15.3 rhino3dm==8.17.0
      - name: Earlier regressions
        run: |
          set -o pipefail
          mkdir -p joint-artifact
          python -m unittest discover -s experiments/P08C.UVFairing -p 'test_*.py' -v 2>&1 | tee joint-artifact/uv-tests.txt
          python -m unittest discover -s experiments/P08C.GeometricFairing -p 'test_*.py' -v 2>&1 | tee joint-artifact/geometric-tests.txt
          python -m unittest discover -s experiments/P08C.CornerRepair -p 'test_*.py' -v 2>&1 | tee joint-artifact/corner-tests.txt
      - name: Joint construction, coverage, flow and native OpenNURBS roundtrip
        run: |
          set -o pipefail
          python -m py_compile experiments/P08D.StructuredTransition/*.py
          python -m unittest discover -s experiments/P08D.StructuredTransition -p 'test_*.py' -v 2>&1 | tee joint-artifact/joint-tests.txt
      - name: Package source and verification boundary
        run: |
          cp experiments/P08D.StructuredTransition/*.py docs/P08D1A_JOINT_GRAPH.md joint-artifact/
          python - <<'PY'
          import pathlib, hashlib, json, os
          root=pathlib.Path('joint-artifact')
          out=dict(patch='P08D.1A',commit=os.environ['GITHUB_SHA'],Rhino_Join='NOT_RUN',Rhino_UI='NOT_RUN',private_model='NOT_SENT_TO_CI',geometry_commit=False,RHP_updated=False)
          out['sha256']={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('*.py')}
          (root/'verification-scope.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SmartSkin-P08D1A-${{ github.run_number }}-${{ github.sha }}
          path: joint-artifact/*
          if-no-files-found: error
          retention-days: 30
