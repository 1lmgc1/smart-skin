name: context-audit-p08a

on:
  push:
    branches: [p08-context-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No product code or release metadata changes
        run: git diff --exit-code a9b8281f9475fb29d38839614b1781ff21b26677 HEAD -- src Directory.Build.props VERSION .github/workflows/build.yml
      - name: Require grammar checker
        run: python -c 'import lib2to3.refactor'
      - name: Syntax and pure helper tests (no Rhino)
        run: |
          python -m py_compile scripts/audit/SmartSkin_ContextAudit.py
          python -m unittest discover -s scripts/audit -p 'test_context_audit.py' -v
      - name: Package pinned diagnostic script
        run: |
          mkdir -p audit-artifact
          cp scripts/audit/SmartSkin_ContextAudit.py docs/P08A_CONTEXT_AUDIT.md audit-artifact/
          python - <<'PY'
          import hashlib, pathlib, os
          p = pathlib.Path('audit-artifact/verification-scope.txt')
          b = pathlib.Path('audit-artifact/SmartSkin_ContextAudit.py').read_bytes()
          p.write_text('audit=P08A.1\ncommit=' + os.environ['GITHUB_SHA']
            + '\nscript_sha256=' + hashlib.sha256(b).hexdigest()
            + '\nchecks=syntax,grammar,pure_helpers,source_guards\nrhino_execution=NOT_RUN\ngeometry=NOT_VERIFIED\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SmartSkin-P08A-audit-${{ github.run_number }}-${{ github.sha }}
          path: audit-artifact/*
          if-no-files-found: error
          retention-days: 30
